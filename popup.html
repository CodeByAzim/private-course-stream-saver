<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Course &amp; Stream Saver — CodeByAzimDev</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #475569;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --teal: #0d9488;
      --red: #dc2626;
      --green: #16a34a;
      --amber: #d97706;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 460px;
      min-height: 360px;
      max-height: 600px;
      overflow-y: auto;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.45;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: #0f172a;
      color: #ffffff;
      padding: 9px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      border-bottom: 1px solid #1e293b;
    }

    .brand {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: -0.025em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .toggle-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      max-width: 140px;
      padding: 3px 7px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: #1e293b;
      color: #f8fafc;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .toggle-pill[aria-expanded="true"],
    .toggle-pill.active-mode {
      background: #1d4ed8;
      border-color: #60a5fa;
    }

    .toggle-pill:hover {
      background: #334155;
    }

    .icon-btn {
      padding: 3px 6px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: transparent;
      color: #e2e8f0;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    .location-bar {
      background: #0f172a;
      color: #f8fafc;
      padding: 10px 12px 12px;
      border-bottom: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .location-bar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #cbd5e1;
      font-weight: 600;
    }

    .location-mode-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .loc-mode-btn {
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .loc-mode-btn:hover {
      background: #334155;
    }

    .loc-mode-btn[aria-pressed="true"] {
      background: #2563eb;
      border-color: #60a5fa;
      color: #ffffff;
    }

    .location-subfolder-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    input[type="text"],
    input[type="url"] {
      line-height: 1.55;
      min-height: 36px;
      padding: 8px 10px;
    }

    .loc-input {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      min-height: 36px;
      line-height: 1.55;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #020617;
      color: #ffffff;
      font-size: 11.5px;
      font-family: inherit;
    }

    .loc-input::placeholder {
      color: #94a3b8;
    }

    .loc-input:focus {
      outline: 2px solid #3b82f6;
      border-color: #60a5fa;
    }

    .loc-set-btn {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      background: #2563eb;
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .loc-set-btn:hover {
      background: #1d4ed8;
    }

    .location-footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .loc-hint {
      font-size: 10.5px;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .loc-drive-btn {
      padding: 4px 8px;
      border-radius: 5px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #f8fafc;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .loc-drive-btn:hover {
      background: #334155;
    }

    .banner {
      padding: 9px 14px;
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .banner-red {
      background: var(--red);
    }

    .banner-green {
      background: var(--green);
    }

    .banner-close {
      background: rgba(255, 255, 255, 0.18);
      border: none;
      color: #ffffff;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .tabs-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 14px 0;
      margin: 0 -14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .tabs-group {
      display: flex;
      gap: 4px;
    }

    .tab-btn {
      padding: 8px 12px;
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn[aria-selected="true"] {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tabs-right-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .btn-dashboard-launch {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 9px;
      border-radius: 6px;
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn-dashboard-launch:hover {
      background: #dbeafe;
      border-color: #93c5fd;
    }

    .btn-sm-primary {
      padding: 5px 10px;
      border-radius: 6px;
      border: none;
      background: var(--accent);
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-sm-primary:hover {
      background: var(--accent-hover);
    }

    .main {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Multi-Download Stacked Queue */
    .downloads-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .downloads-header {
      padding: 8px 10px;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .downloads-heading {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
    }

    .downloads-bulk {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-bulk {
      padding: 3px 7px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-bulk:hover {
      background: #e2e8f0;
    }

    .downloads-list {
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      divide-y: 1px solid var(--border);
    }

    .job-card {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .job-card:last-child {
      border-bottom: none;
    }

    .job-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .job-filename {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .job-status-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .job-status-badge.active {
      background: #ccfbf1;
      color: #0f766e;
    }

    .job-status-badge.paused {
      background: #fef3c7;
      color: #b45309;
    }

    .job-status-badge.error {
      background: #fee2e2;
      color: #b91c1c;
    }

    .job-status-badge.completed {
      background: #dcfce7;
      color: #15803d;
    }

    .progress-track {
      width: 100%;
      height: 7px;
      background: var(--surface-alt);
      border-radius: 9999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--teal);
      transition: width 0.2s ease;
    }

    .progress-fill.paused {
      background: var(--amber);
    }

    .progress-fill.error {
      background: var(--red);
    }

    .progress-fill.completed {
      background: var(--green);
    }

    .progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      gap: 6px;
    }

    .job-error-text {
      font-size: 10.5px;
      color: var(--red);
      font-weight: 600;
    }

    .progress-controls {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }

    .btn-ctrl {
      flex: 1;
      padding: 4px 8px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-ctrl:hover {
      background: #e2e8f0;
    }

    .btn-ctrl.danger {
      color: var(--red);
      border-color: #fecaca;
      background: #fef2f2;
    }

    /* Paste Any Video Link Bar */
    .paste-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    .paste-header {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .paste-sub {
      font-size: 10.5px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .paste-row {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .paste-input {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      min-height: 36px;
      line-height: 1.55;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      font-size: 11.5px;
      font-family: inherit;
    }

    .paste-input:focus {
      outline: 2px solid rgba(37, 99, 235, 0.25);
      border-color: var(--accent);
    }

    .btn-paste {
      padding: 6px 9px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-paste:hover {
      background: #e2e8f0;
    }

    .btn-load-link {
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      background: var(--accent);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-load-link:hover {
      background: var(--accent-hover);
    }

    .btn-load-link:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .paste-status {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .paste-status.error {
      color: var(--red);
    }

    .paste-status.ok {
      color: var(--green);
    }

    .streams-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stream-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .stream-summary {
      width: 100%;
      padding: 10px 12px;
      background: var(--surface);
      border: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      text-align: left;
    }

    .stream-summary:hover {
      background: #f8fafc;
    }

    .stream-summary-left {
      min-width: 0;
      flex: 1;
    }

    .stream-kicker-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 2px;
      flex-wrap: wrap;
    }

    .stream-kicker {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
    }

    .duration-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 6px;
      border-radius: 5px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      font-size: 10.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .stream-caption-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 1px;
    }

    .stream-caption-title.is-placeholder {
      color: var(--amber);
      font-style: italic;
    }

    .stream-host {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stream-body {
      padding: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stream-details-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 9px;
      border-radius: 6px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .field-label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .caption-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .caption-row .input {
      flex: 1;
      min-width: 0;
    }

    .btn-caption-paste {
      padding: 8px 10px;
      min-height: 36px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-caption-paste:hover {
      background: #e2e8f0;
    }

    .input, .select {
      width: 100%;
      padding: 8px 10px;
      min-height: 36px;
      line-height: 1.55;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      font-size: 12.5px;
      font-family: inherit;
    }

    .input.caption-placeholder {
      color: #64748b;
      font-style: italic;
    }

    .input.caption-guard-error {
      border-color: var(--amber) !important;
      background: #fffbeb !important;
      outline: 2px solid rgba(217, 119, 6, 0.28) !important;
      color: var(--text);
      font-style: normal;
    }

    .caption-guard-msg {
      margin-top: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #b45309;
    }

    .input:focus, .select:focus {
      outline: 2px solid rgba(37, 99, 235, 0.25);
      border-color: var(--accent);
    }

    .filename-preview {
      padding: 7px 9px;
      border-radius: 6px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: var(--text);
      word-break: break-all;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-download {
      width: 100%;
      padding: 10px 14px;
      border-radius: 7px;
      border: none;
      background: var(--accent);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-download:hover {
      background: var(--accent-hover);
    }

    .btn-download:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .dup-notice {
      font-size: 11px;
      font-weight: 600;
      color: var(--amber);
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 6px;
      padding: 5px 8px;
    }

    .pic-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .pic-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .pic-thumb {
      width: 100%;
      height: 112px;
      object-fit: cover;
      background: var(--surface-alt);
    }

    .pic-footer {
      padding: 7px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .pic-dims {
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .pic-dl-btn {
      padding: 4px 8px;
      border-radius: 5px;
      border: none;
      background: var(--accent);
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .empty-state {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 16px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    .recent-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .recent-toggle {
      width: 100%;
      padding: 8px 12px;
      background: var(--surface);
      border: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
    }

    .recent-list {
      border-top: 1px solid var(--border);
      padding: 6px 12px;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .recent-item {
      font-size: 11.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand" title="Private Course &amp; Stream Saver — CodeByAzimDev">Private Course &amp; Stream Saver — CodeByAzimDev</div>
    <div class="header-actions">
      <button id="toggleSaveLocationBar" class="toggle-pill" type="button" aria-expanded="false" title="Configure Save Location">
        📁 Default Folder
      </button>
      <button id="btnRefresh" class="icon-btn" type="button" title="Rescan page media">Refresh</button>
      <button id="btnClear" class="icon-btn" type="button" title="Clear detected items">Clear</button>
    </div>
  </header>

  <section id="saveLocationBar" class="location-bar hidden" aria-label="Save Location Settings">
    <div class="location-bar-header">
      <span>Save Location Mode</span>
      <span id="locationModeSummary">Downloads/</span>
    </div>
    <div class="location-mode-row">
      <button id="btnModeDefault" class="loc-mode-btn" type="button" aria-pressed="true">
        📁 Default Folder (Downloads)
      </button>
      <button id="btnModeAsk" class="loc-mode-btn" type="button" aria-pressed="false">
        📂 Ask Location Every Time
      </button>
    </div>
    <div class="location-subfolder-row">
      <input
        id="subfolderInput"
        class="loc-input"
        type="text"
        placeholder="Custom subfolder (e.g. Umrah Course)"
        aria-label="Custom subfolder name"
      />
      <button id="btnSetSubfolder" class="loc-set-btn" type="button">Set Folder</button>
    </div>
    <div class="location-footer-row">
      <span class="loc-hint">Use Ask Location for D:\ / E:\ or change Chrome base:</span>
      <button id="btnChangeDrive" class="loc-drive-btn" type="button">Change Browser Drive</button>
    </div>
  </section>

  <div id="offlineBanner" class="banner banner-red hidden" role="alert">
    <span>Paused — Network Disconnected (Waiting to resume...)</span>
  </div>

  <div id="errorBanner" class="banner banner-red hidden" role="alert">
    <span id="errorBannerText"></span>
    <button id="dismissErrorBanner" class="banner-close" type="button" aria-label="Dismiss">✕</button>
  </div>

  <div id="savedBanner" class="banner banner-green hidden" role="status">
    <span id="savedBannerText">✓ Saved</span>
    <button id="dismissSavedBanner" class="banner-close" type="button" aria-label="Dismiss">✕</button>
  </div>

  <main class="main">
    <section id="downloadsSection" class="downloads-section hidden" aria-live="polite">
      <div class="downloads-header">
        <span id="downloadsHeading" class="downloads-heading">Active &amp; Queued Downloads (0)</span>
        <div id="downloadsBulk" class="downloads-bulk hidden">
          <button id="btnPauseAll" class="btn-bulk" type="button">Pause All</button>
          <button id="btnResumeAll" class="btn-bulk" type="button">Resume All</button>
          <button id="btnClearDone" class="btn-bulk" type="button">Clear Done</button>
        </div>
      </div>
      <div id="downloadsList" class="downloads-list"></div>
    </section>

    <nav class="tabs-bar" aria-label="Media categories">
      <div class="tabs-group" role="tablist">
        <button id="tabVideos" class="tab-btn" type="button" role="tab" aria-selected="true">Videos (0)</button>
        <button id="tabPictures" class="tab-btn" type="button" role="tab" aria-selected="false">HQ Pictures (0)</button>
      </div>
      <div class="tabs-right-actions">
        <button id="btnDownloadAllHq" class="btn-sm-primary hidden" type="button">Download All HQ</button>
        <button id="btnOpenDashboard" class="btn-dashboard-launch" type="button" title="Open Full-Page Download & Stream Diagnostics Dashboard">Open Dashboard ↗</button>
      </div>
    </nav>

    <section id="videosPanel">
      <div id="pasteLinkBar" class="paste-card">
        <div class="paste-header">
          <span>Paste Any Video Link</span>
          <span class="paste-sub">.m3u8 · .mpd · .mp4</span>
        </div>
        <div class="paste-row">
          <input
            id="pasteLinkInput"
            class="paste-input"
            type="url"
            placeholder="Paste .m3u8, .mpd, .mp4, or stream link..."
            aria-label="Paste video stream URL"
          />
          <button id="btnPasteLink" class="btn-paste" type="button" title="Paste from clipboard and load">Paste</button>
          <button id="btnLoadLink" class="btn-load-link" type="button">Load Link</button>
        </div>
        <div id="pasteLinkStatus" class="paste-status hidden"></div>
      </div>
      <div id="streamsContainer" class="streams-list"></div>
    </section>

    <section id="picturesPanel" class="hidden"></section>

    <section id="recentSection" class="recent-wrap hidden">
      <button id="btnToggleRecent" class="recent-toggle" type="button" aria-expanded="false">
        <span>Recent Saved (0)</span>
        <span id="recentChevron">▸</span>
      </button>
      <ul id="recentList" class="recent-list hidden"></ul>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
